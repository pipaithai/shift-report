<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายงานการทำเวรประจำสัปดาห์ (Online)</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Prompt', sans-serif; background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb); background-size: 400% 400%; animation: gradientBG 15s ease infinite; min-height: 100vh; padding: 40px 20px; color: #333; }
  @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; font-weight: 600; text-shadow: 1px 1px 2px rgba(255,255,255,0.5); }
  .subtitle { text-align: center; color: #555; margin-bottom: 40px; font-size: 14px; font-weight: 300; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto 40px; }
  .card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; align-items: center; transition: transform 0.3s ease, box-shadow 0.3s ease; animation: fadeUp 0.6s ease forwards; opacity: 0; }
  .card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); }
  .card:nth-child(1) { animation-delay: 0.1s; }
  .card:nth-child(2) { animation-delay: 0.2s; }
  .card:nth-child(3) { animation-delay: 0.3s; }
  .card:nth-child(4) { animation-delay: 0.4s; }
  .card:nth-child(5) { animation-delay: 0.5s; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .card h2 { margin-bottom: 15px; font-size: 18px; color: #2c3e50; font-weight: 500; width: 100%; text-align: center; padding-bottom: 10px; border-bottom: 2px dashed rgba(200,200,200,0.5); }
  .drop-zone { width: 100%; height: 180px; border: 2px dashed #a0aec0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; background: rgba(255, 255, 255, 0.5); position: relative; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .drop-zone:hover { border-color: #667eea; background: rgba(255, 255, 255, 0.9); transform: scale(1.02); }
  .drop-zone img { width: 100%; height: 100%; object-fit: cover; animation: fadeIn 0.4s ease-in-out; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .drop-zone span { color: #718096; font-size: 14px; text-align: center; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .delete-btn { margin-top: 15px; background: #ff7675; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: 'Prompt', sans-serif; transition: background 0.2s, transform 0.2s; display: none; width: 100%; }
  .delete-btn:hover { background: #d63031; transform: scale(1.05); }
  .apply-container { text-align: center; margin-top: 20px; }
  .apply-btn { background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff; border: none; padding: 14px 45px; font-size: 18px; font-family: 'Prompt', sans-serif; font-weight: 500; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 176, 155, 0.3); transition: all 0.3s ease; }
  .apply-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0, 176, 155, 0.5); }
  .toast { position: fixed; bottom: 30px; right: 30px; background: #2ecc71; color: white; padding: 15px 25px; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 10px; font-weight: 500; opacity: 0; transform: translateY(20px); transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  input[type="file"] { display: none; }
  .loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; color: #667eea; font-weight: bold; display: none; z-index: 10; }
</style>
</head>
<body>

<h1>📋 รายงานการทำเวรประจำสัปดาห์</h1>
<p class="subtitle">อัปเดตข้อมูลตรงกันทุกคนแบบเรียลไทม์ ⚡</p>

<div class="grid" id="grid"></div>

<div class="apply-container">
  <button class="apply-btn" onclick="applyAll()">💾 บันทึกขึ้นระบบออนไลน์</button>
</div>

<div class="toast" id="toast">✅ บันทึกเรียบร้อย</div>

<script>
  const days = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์'];
  const grid = document.getElementById('grid');
  const toast = document.getElementById('toast');

  days.forEach((day, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h2>วัน${day}</h2>
      <label class="drop-zone" id="zone-${i}">
        <div class="loading-overlay" id="loading-${i}">กำลังบีบอัดรูป...</div>
        <span id="placeholder-${i}"><span style="font-size: 28px;">📷</span>คลิกเลือกรูป</span>
        <input type="file" accept="image/*" id="file-${i}">
      </label>
      <button class="delete-btn" id="del-${i}" onclick="deleteImage(${i})">🗑 ลบรูปภาพ</button>
    `;
    grid.appendChild(card);
    document.getElementById(`file-${i}`).addEventListener('change', e => handleFile(e, i));
  });

  const firebaseConfig = {
    apiKey: "AIzaSyAJH8rDMSKkwvckburjXXamCravKgxpEBk",
    authDomain: "shift-report-6bad3.firebaseapp.com",
    databaseURL: "https://shift-report-6bad3-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shift-report-6bad3",
    storageBucket: "shift-report-6bad3.firebasestorage.app",
    messagingSenderId: "931771884264",
    appId: "1:931771884264:web:8fea882fc80305aff3df5d",
    measurementId: "G-0919P2BZTQ"
  };

  let db;
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    db = firebase.database();
    
    db.ref('weekly_duties').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      days.forEach((_, i) => {
        if (data[`day-${i}`]) {
          showImage(i, data[`day-${i}`], true);
        } else {
          clearImageUI(i);
        }
      });
    });
  } catch (error) {
    console.warn("Offline Mode");
  }

  function handleFile(e, i) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById(`loading-${i}`).style.display = 'flex';

    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.src = ev.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        const scaleSize = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scaleSize;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
        
        document.getElementById(`loading-${i}`).style.display = 'none';
        showImage(i, compressedDataUrl, false);
      }
    };
    reader.readAsDataURL(file);
  }

  function showImage(i, dataUrl, isFromDB) {
    const zone = document.getElementById(`zone-${i}`);
    const placeholder = document.getElementById(`placeholder-${i}`);
    const delBtn = document.getElementById(`del-${i}`);

    const oldImg = zone.querySelector('img');
    if (oldImg) oldImg.remove();

    const img = document.createElement('img');
    img.src = dataUrl;
    zone.appendChild(img);
    placeholder.style.display = 'none';
    delBtn.style.display = 'block';

    if (!isFromDB) {
      zone.dataset.pending = dataUrl; 
    } else {
      zone.dataset.pending = ''; 
    }
  }

  function clearImageUI(i) {
    const zone = document.getElementById(`zone-${i}`);
    const placeholder = document.getElementById(`placeholder-${i}`);
    const delBtn = document.getElementById(`del-${i}`);
    const img = zone.querySelector('img');
    if (img) img.remove();
    placeholder.style.display = 'flex';
    delBtn.style.display = 'none';
    zone.dataset.pending = '';
    document.getElementById(`file-${i}`).value = '';
  }

  function deleteImage(i) {
    clearImageUI(i);
    if(db) db.ref(`weekly_duties/day-${i}`).remove();
  }

  function applyAll() {
    let count = 0;
    const updates = {};
    
    days.forEach((_, i) => {
      const zone = document.getElementById(`zone-${i}`);
      if (zone.dataset.pending) {
        updates[`day-${i}`] = zone.dataset.pending;
        count++;
      }
    });

    if (count > 0 && db) {
      db.ref('weekly_duties').update(updates).then(() => {
        days.forEach((_, i) => document.getElementById(`zone-${i}`).dataset.pending = '');
        showToast(`✅ บันทึกออนไลน์เรียบร้อย (${count} รูป)`);
      }).catch((error) => {
        showToast(`❌ เกิดข้อผิดพลาด: ${error.message}`);
      });
    } else if (!db) {
       showToast(`❌ กรุณาตั้งค่า Firebase ก่อน`);
    } else {
      showToast(`ข้อมูลเป็นปัจจุบันแล้ว`);
    }
  }

  function showToast(message) {
    toast.innerHTML = `${message}<br><small style="font-weight:300; font-size:12px;">${new Date().toLocaleTimeString('th-TH')}</small>`;
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); }, 3500);
  }

  function checkReset() {
    const lastReset = localStorage.getItem('lastResetOnline');
    const now = new Date();
    const lastSunday = new Date(now);
    const day = now.getDay(); 
    lastSunday.setDate(now.getDate() - day);
    lastSunday.setHours(0, 0, 0, 0);

    if (!lastReset || new Date(lastReset) < lastSunday) {
      if(db) db.ref('weekly_duties').remove();
      localStorage.setItem('lastResetOnline', now.toISOString());
    }
  }
  
  setInterval(checkReset, 60000);
  checkReset();
</script>

</body>
</html>
